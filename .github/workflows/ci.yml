name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: xvfb-run -a npm test

      - name: Package
        run: npx @vscode/vsce package --out live-lib.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: live-lib-vsix
          path: live-lib.vsix
